[workspace]
resolver = "3"
members = ["crates/*"]
# Defensive: template manifests are named Cargo.toml.liquid precisely so
# cargo never sees them, but this stops a stray real one from joining.
exclude = ["templates"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tess-fun/pieces"
authors = ["tess-fun"]

# Single source of truth for every third-party version in the stack. Crates
# refer to these with `dep = { workspace = true }` — never a bare version.
#
# Only list what a crate actually uses. An entry no crate depends on is never
# resolved, so its version silently drifts out of step with the real graph: the
# `toml = "0.9"` that used to sit here would have collided with the 0.8 that
# figment already pulls, and the first crate to opt in would have tripped
# cargo-deny's multiple-versions check for no reason.
[workspace.dependencies]
# --- internal ---
pc-error = { path = "crates/pc-error", version = "0.2.1" }
pc-config = { path = "crates/pc-config", version = "0.2.1" }
pc-telemetry = { path = "crates/pc-telemetry", version = "0.2.1" }
pc-testkit = { path = "crates/pc-testkit", version = "0.2.1" }

# --- foundation ---
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
zeroize = { version = "1", features = ["derive"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }
directories = "6"

# --- testing ---
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Noise from `pedantic` that isn't worth the churn in this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.dev]
# Rust CI/dev builds spend most of their time linking; thin-local is a good
# default trade for a workspace this size.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
