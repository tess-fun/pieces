name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A superseded push has nothing worth finishing — and this is
# a private repo, so every wasted minute is billed.
concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  ci:
    # `pieces` is public, so no token is needed to fetch it. If you later add a
    # dependency on a private repo, pass `secrets: stack-token: ...` here.
    uses: tess-fun/pieces/.github/workflows/rust-ci.yml@{{stack_tag}}
