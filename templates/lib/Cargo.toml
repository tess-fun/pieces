[package]
name = "{{project-name}}"
description = "{{description}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
pc-error = { git = "https://github.com/tess-fun/pieces", tag = "{{stack_tag}}" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
pc-testkit = { git = "https://github.com/tess-fun/pieces", tag = "{{stack_tag}}" }

# A library, so the strict set applies: no printing, no unwrap, no panics on
# behalf of a caller who cannot catch them.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
